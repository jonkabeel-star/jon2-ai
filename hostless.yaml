# Jon2 AI Hostless deployment.
# The runtime is capped at the published free account allowance.
# Docker builds are not charged by Hostless; runtime capacity stays free-capped.
# Do not add databases, workers, replicas, durable volumes, or paid capacity.
build:
  system: docker
  min_cpu: 0.5
  max_cpu: 2
  min_memory: 512
  max_memory: 4096

dockerfile_path: "./Dockerfile"
working_directory: "/"
build_context_directory: "/"

scaling:
  trigger: http_requests
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 256
  max_memory: 1024
  min_replicas: 1
  max_replicas: 1
  max_http_requests_per_replica: 20

health_check:
  type: http
  http_path: "/api/health/live"
  interval_in_seconds: 30
