services:
  - type: web
    name: jon2-ai-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/live
    envVars:
      - key: JON2_CHAT_RELEASE_APPROVED
        value: "false"
      - key: JON2_EXPERIMENTAL_CHAT
        value: "false"
      - key: JON2_RUNTIME_TOKEN
        sync: false
      - key: KAGGLE_API_TOKEN
        sync: false
