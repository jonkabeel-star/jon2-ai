use_default_settings: true
server:
  secret_key: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET"
  limiter: true
  image_proxy: false
  method: GET
  port: 8080
  bind_address: "0.0.0.0"
  public_instance: false
ui:
  static_use_hash: true
search:
  safe_search: 1
  autocomplete: ""
  default_lang: "all"
  formats:
    - html
    - json
outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  pool_connections: 50
  pool_maxsize: 20
  enable_http2: true
