<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090d18"><title>Jon2 Builder</title>
<style>
:root{color-scheme:dark;--bg:#090d18;--panel:#111a2b;--panel2:#0d1524;--line:#263653;--text:#f5f7ff;--muted:#a6b3cc;--blue:#718cff;--cyan:#5de5dc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;height:100vh;overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{height:100%;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);background:#0c1422}.brand{font-weight:850;display:flex;gap:10px;align-items:center}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#08101d}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#17243a;border-radius:9px;padding:8px 12px}.primary{background:linear-gradient(120deg,#718cff,#596de9);border:0;font-weight:750}.workspace{min-height:0;display:grid;grid-template-columns:310px minmax(0,1fr)}.side{min-height:0;border-left:1px solid var(--line);display:flex;flex-direction:column;background:#0c1422}.side-head{padding:14px;border-bottom:1px solid var(--line)}.side-head h2{font-size:14px;margin:0 0 8px}.side-head p,.muted{color:var(--muted);font-size:11px;line-height:1.7}.prompt{width:100%;min-height:112px;resize:vertical;border:1px solid #344766;border-radius:12px;background:#080f1c;color:var(--text);padding:12px;outline:0}.prompt:focus,.editor:focus{border-color:var(--blue)}.sendrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px}.notice{font-size:10px;color:#f1cb84;line-height:1.6}.projects{padding:12px;overflow:auto;flex:1}.projects h3,.files h3{font-size:11px;color:var(--muted);margin:4px 0 10px}.project{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:9px;border:1px solid transparent;cursor:pointer}.project.active,.project:hover{background:#17243a;border-color:#2c4163}.main{min-width:0;min-height:0;display:grid;grid-template-rows:48px 1fr}.tabs{display:flex;align-items:center;gap:7px;padding:7px 12px;border-bottom:1px solid var(--line);background:#0c1422}.tab{padding:7px 12px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--muted)}.tab.active{background:#17243a;border-color:var(--line);color:var(--text)}.panes{min-height:0;display:grid;grid-template-columns: minmax(0,1fr) minmax(0,1fr)}.editor-pane,.preview-pane{min-width:0;min-height:0;display:flex;flex-direction:column}.editor-pane{border-left:1px solid var(--line)}.pane-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line);color:var(--muted);font-size:11px}.files{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:7px;flex-wrap:wrap}.file{border:1px solid var(--line);background:#101b2e;border-radius:7px;padding:6px 9px;font-size:11px}.file.active{border-color:var(--blue);color:#cdd7ff}.editor{flex:1;min-height:0;width:100%;resize:none;border:0;outline:0;background:#080f1c;color:#dce7ff;padding:14px;direction:ltr;text-align:left;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}.preview{flex:1;width:100%;border:0;background:white}.empty{padding:20px;color:var(--muted);font-size:12px;line-height:1.8}.bottom{display:none}.mobile-switch{display:none}
@media(max-width:800px){body{overflow:auto;height:100dvh}.app{height:100dvh;grid-template-rows:54px 1fr}.workspace{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{border-left:0;border-bottom:1px solid var(--line)}.side-head{padding:10px}.side-head p{display:none}.prompt{min-height:68px}.projects{display:none}.main{min-height:0;grid-template-rows:44px minmax(0,1fr)}.panes{grid-template-columns:1fr;grid-template-rows:minmax(220px,1fr) minmax(240px,1fr)}.editor-pane{border-left:0;border-bottom:1px solid var(--line)}.editor{min-height:180px}.preview{min-height:230px}.top{padding:0 10px}.top-actions .btn{padding:7px}.mobile-switch{display:inline-block}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><span class="logo">J2</span><span>Jon2 Builder</span><span class="muted">داخل Jon2 AI</span></div><div class="top-actions"><button class="btn" id="newProject">مشروع جديد</button><button class="btn" id="importProject">استيراد JSON</button><input id="importFile" type="file" accept="application/json,.json" hidden><button class="btn" id="downloadFile">تنزيل الملف الحالي</button><button class="btn primary" id="download">تصدير المشروع JSON</button></div></header>
<div class="workspace">
<aside class="side"><section class="side-head"><h2>ماذا تريد أن تبني؟</h2><textarea id="idea" class="prompt" placeholder="مثال: أنشئ صفحة هبوط لمتجر إلكتروني عربي..."></textarea><div class="sendrow"><span class="notice">نسخة أولية: لا يوجد عقل توليد متصل بعد.</span><button id="build" class="btn primary">إنشاء هيكل</button></div></section><section class="projects"><h3>مشاريعك على هذا الجهاز</h3><div id="projectList"></div><p class="muted">يتم حفظ المشاريع محليًا في هذا المتصفح.</p></section></aside>
<main class="main"><nav class="tabs"><button class="tab active" id="codeTab">الكود</button><button class="tab" id="previewTab">المعاينة</button><button class="tab mobile-switch" id="splitTab">الاثنان</button><span class="muted" id="status">جاهز</span></nav>
<div class="panes" id="panes"><section class="editor-pane"><div class="pane-head"><span>ملفات المشروع</span><span id="fileLabel">index.html</span><span style="display:flex;gap:5px"><button class="file" id="undo" type="button" title="تراجع" disabled>تراجع ↶</button><button class="file" id="redo" type="button" title="إعادة" disabled>إعادة ↷</button></span></div><div class="files"><button class="file active" data-file="html">index.html</button><button class="file" data-file="css">style.css</button><button class="file" data-file="js">script.js</button></div><textarea id="editor" class="editor" spellcheck="false" aria-label="محرر الكود"></textarea></section><section class="preview-pane"><div class="pane-head"><span>معاينة مباشرة</span><button class="btn" id="refresh">تحديث</button></div><iframe id="preview" class="preview" title="معاينة المشروع" sandbox="allow-scripts"></iframe></section></div></main>
</div></div>
<script>
const KEY="jon2_builder_projects_v1";const $=id=>document.getElementById(id);
const starter={html:'<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n  <meta charset="utf-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1">\n  <title>مشروعي الأول</title>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <main class="hero">\n    <h1>أهلًا بك في مشروعي</h1>\n    <p>ابدأ بتعديل الكود وشاهد النتيجة مباشرة.</p>\n    <button id="hello">جرّبني</button>\n  </main>\n  <script src="script.js"><\\/script>\n</body>\n</html>',css:'* { box-sizing: border-box; }\nbody { margin: 0; font-family: Arial, sans-serif; background: #f3f6ff; color: #17223b; }\n.hero { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 24px; }\nbutton { border: 0; border-radius: 10px; padding: 12px 20px; background: #536dfe; color: white; cursor: pointer; }',js:'document.getElementById("hello")?.addEventListener("click", () => {\n  alert("أول مشروع لك مع Jon2 Builder!");\n});'};
let projects=[];let current=null;let activeFile="html";const histories=new Map();const HISTORY_LIMIT=100;let restoringHistory=false;
function historyKey(){return current.id+":"+activeFile}
function historyState(){const h=histories.get(historyKey())||{items:[$("editor").value],index:0};histories.set(historyKey(),h);$("undo").disabled=h.index<=0;$("redo").disabled=h.index>=h.items.length-1}
function recordHistory(value){if(restoringHistory)return;let h=histories.get(historyKey());if(!h)h={items:[value],index:0};if(h.items[h.index]===value){historyState();return}h.items=h.items.slice(0,h.index+1);h.items.push(value);if(h.items.length>HISTORY_LIMIT)h.items.shift();h.index=h.items.length-1;histories.set(historyKey(),h);historyState()}
function moveHistory(delta){const h=histories.get(historyKey());if(!h)return;const next=h.index+delta;if(next<0||next>=h.items.length)return;h.index=next;restoringHistory=true;$("editor").value=h.items[h.index];restoringHistory=false;current[activeFile]=$("editor").value;persist();historyState();$("status").textContent=delta<0?"تم التراجع عن التعديل":"تمت إعادة التعديل";}
function persist(){localStorage.setItem(KEY,JSON.stringify(projects));}
function load(){try{projects=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{projects=[]}if(!projects.length){const p={id:crypto.randomUUID(),name:"مشروعي الأول",...starter};projects=[p];persist()}current=projects[0];renderList();loadEditor()}
function renderList(){$("projectList").replaceChildren();projects.forEach(p=>{const row=document.createElement("div");row.style.display="flex";row.style.gap="5px";row.style.alignItems="center";const b=document.createElement("button");b.className="project"+(p.id===current.id?" active":"");b.style.flex="1";b.textContent="▣ "+p.name;b.onclick=()=>{saveEditor();current=p;renderList();loadEditor()};const rename=document.createElement("button");rename.className="file";rename.textContent="تسمية";rename.title="إعادة تسمية المشروع";rename.onclick=()=>{const n=prompt("اسم المشروع الجديد",p.name);if(n&&n.trim()){p.name=n.trim().slice(0,60);persist();renderList()}};const del=document.createElement("button");del.className="file";del.textContent="حذف";del.title="حذف المشروع";del.onclick=()=>{if(!confirm("حذف المشروع "+p.name+"؟ لا يمكن التراجع عن ذلك."))return;projects=projects.filter(x=>x.id!==p.id);if(!projects.length)projects=[{id:crypto.randomUUID(),name:"مشروعي الأول",...starter}];if(current.id===p.id){current=projects[0];activeFile="html";loadEditor()}persist();renderList()};row.append(b,rename,del);$("projectList").append(row)})}
function saveEditor(){if(!current)return;current[activeFile]=$("editor").value;persist()}
function loadEditor(){$("editor").value=current[activeFile];$("fileLabel").textContent=activeFile==="html"?"index.html":activeFile==="css"?"style.css":"script.js";document.querySelectorAll(".file[data-file]").forEach(b=>b.classList.toggle("active",b.dataset.file===activeFile));if(!histories.has(historyKey()))histories.set(historyKey(),{items:[$("editor").value],index:0});historyState();updatePreview()}
function updatePreview(){saveEditor();const escapeEnd=(value,tag)=>value.replace(new RegExp("</"+tag,"gi"),()=>"<"+String.fromCharCode(92)+"/"+tag);const safeCss=escapeEnd(current.css,"style");const safeJs=escapeEnd(current.js,"script");let html=current.html;if(html.includes("</head>"))html=html.replace("</head>",'<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data: blob:; style-src \'unsafe-inline\'; script-src \'unsafe-inline\'; connect-src \'none\'; form-action \'none\'"><style>'+safeCss+'</style></head>');else html='<style>'+safeCss+'</style>'+html;if(html.includes("</body>"))html=html.replace("</body>",'<script>'+safeJs+'<'+String.fromCharCode(92)+'/script></body>');else html+='<script>'+safeJs+'<'+String.fromCharCode(92)+'/script>';$("preview").srcdoc=html;$("status").textContent="تم تحديث المعاينة داخل بيئة معزولة"};
document.querySelectorAll(".file").forEach(b=>b.onclick=()=>{saveEditor();activeFile=b.dataset.file;loadEditor()});
$("editor").addEventListener("input",()=>{saveEditor();recordHistory($("editor").value);$("status").textContent="تعديلات غير معروضة — اضغط تحديث"});
$("undo").onclick=()=>moveHistory(-1);$("redo").onclick=()=>moveHistory(1);
$("refresh").onclick=updatePreview;
$("build").onclick=()=>{const idea=$("idea").value.trim();if(!idea){$("status").textContent="اكتب وصف المشروع أولًا";return}const p={id:crypto.randomUUID(),name:idea.slice(0,28),...starter};p.html=p.html.replace("مشروعي الأول",p.name).replace("أهلًا بك في مشروعي","مشروع جديد: "+p.name).replace("ابدأ بتعديل الكود وشاهد النتيجة مباشرة.", "هذا هيكل أولي قابل للتعديل. وصفك: "+idea);projects.unshift(p);current=p;activeFile="html";persist();renderList();loadEditor();$("status").textContent="تم إنشاء هيكل ابتدائي. لم يتم توليد كود ذكي بعد."};
$("newProject").onclick=()=>{const p={id:crypto.randomUUID(),name:"مشروع جديد",...starter};projects.unshift(p);current=p;activeFile="html";persist();renderList();loadEditor()};
$("importProject").onclick=()=> $("importFile").click();
$("importFile").onchange=async e=>{const file=e.target.files?.[0];e.target.value="";if(!file)return;if(file.size>2*1024*1024){alert("الملف أكبر من الحد المسموح (2MB).");return}try{const data=JSON.parse(await file.text());const files=data.files||data;const html=files["index.html"]??files.html;const css=files["style.css"]??files.css;const js=files["script.js"]??files.js;if(typeof html!=="string"||typeof css!=="string"||typeof js!=="string"||html.length>800000||css.length>500000||js.length>500000)throw new Error("invalid");const p={id:crypto.randomUUID(),name:String(data.project||"مشروع مستورد").slice(0,60),html,css,js};projects.unshift(p);current=p;activeFile="html";persist();renderList();loadEditor();$("status").textContent="تم استيراد المشروع بنجاح"}catch{alert("ملف المشروع غير صالح. استخدم ملف JSON صادرًا من Jon2 Builder.")}};

$("download").onclick=()=>{saveEditor();const files={"index.html":current.html,"style.css":current.css,"script.js":current.js};const payload=JSON.stringify({project:current.name,files},null,2);const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([payload],{type:"application/json"}));a.download="jon2-project-"+current.id+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$("downloadFile").onclick=()=>{saveEditor();const names={html:"index.html",css:"style.css",js:"script.js"};const types={html:"text/html",css:"text/css",js:"text/javascript"};const a=document.createElement("a");const url=URL.createObjectURL(new Blob([current[activeFile]],{type:types[activeFile]+";charset=utf-8"}));a.href=url;a.download=names[activeFile];a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$("codeTab").onclick=()=>{$("panes").style.gridTemplateColumns="1fr 1fr";$("codeTab").classList.add("active");$("previewTab").classList.remove("active")};
$("previewTab").onclick=()=>{$("panes").style.gridTemplateColumns="0 1fr";$("previewTab").classList.add("active");$("codeTab").classList.remove("active")};
$("splitTab").onclick=()=>{$("panes").style.gridTemplateColumns="1fr 1fr"};
load();
</script></body></html>
