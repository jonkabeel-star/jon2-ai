name: Jon2 Autonomous Brain Builder

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ai_engine/autonomous_builder.py"
      - "ai_engine/engineer_agent.py"
      - "ai_engine/quality_evaluator.py"
      - "ai_engine/evaluation_cases.jsonl"
      - "ai_engine/test_*.py"
      - "ai_engine/preflight_training.py"
      - "ai_engine/source_approval.py"
      - ".github/workflows/jon2-autonomous-builder.yml"
  push:
    branches: [main]
    paths:
      - "ai_engine/autonomous_builder.py"
      - "ai_engine/engineer_agent.py"
      - "ai_engine/quality_evaluator.py"
      - "ai_engine/evaluation_cases.jsonl"
      - "ai_engine/preflight_training.py"
      - "ai_engine/source_approval.py"
      - "ai_engine/model_profiles.py"
      - "ai_engine/training_data/**"
      - ".github/workflows/jon2-autonomous-builder.yml"

permissions:
  contents: read

concurrency:
  group: jon2-autonomous-brain-builder
  cancel-in-progress: false

jobs:
  inspect-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test autonomous safety and Arabic evaluation
        working-directory: ai_engine
        run: |
          python -m unittest test_autonomous_builder test_quality_evaluator test_engineer_agent -v

      - name: Inspect language engine and produce engineering plan
        run: |
          python ai_engine/engineer_agent.py \
            --root . \
            --cases ai_engine/evaluation_cases.jsonl \
            --output /tmp/jon2-engineering-plan.json

      - name: Run source and training readiness assessment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          set +e
          python ai_engine/autonomous_builder.py \
            --root . \
            --data ai_engine/training_data \
            --approval-manifest ai_engine/training_data/source_approvals.json \
            --profile arabic_30m \
            --report /tmp/jon2-autonomous-brain-report.json
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Preflight passed; owner approval is still required."
          elif [ "$status" -eq 2 ]; then
            echo "Training safely blocked; see report."
          else
            exit "$status"
          fi

      - name: Upload metadata-only plans
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jon2-autonomous-engineering-assessment
          path: |
            /tmp/jon2-engineering-plan.json
            /tmp/jon2-autonomous-brain-report.json
          if-no-files-found: warn
          retention-days: 14
