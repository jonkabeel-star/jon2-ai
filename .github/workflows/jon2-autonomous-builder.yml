name: Jon2 Autonomous Brain Builder

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ai_engine/**"
      - ".github/workflows/jon2-autonomous-builder.yml"
  push:
    branches: [main]
    paths:
      - "ai_engine/**"
      - ".github/workflows/jon2-autonomous-builder.yml"

permissions:
  contents: read

concurrency:
  group: jon2-autonomous-brain-builder
  cancel-in-progress: false

jobs:
  inspect-and-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch for existing read-only preflight
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Run safety and evaluator tests
        working-directory: ai_engine
        run: |
          python -m unittest test_autonomous_builder test_quality_evaluator test_engineer_agent test_semantic_and_training_gate -v
      - name: Inspect code and produce engineering plan
        run: |
          python ai_engine/engineer_agent.py --root . --cases ai_engine/evaluation_cases.jsonl --output /tmp/jon2-engineering-plan.json
      - name: Run read-only rights and training preflight
        run: |
          set +e
          python ai_engine/autonomous_builder.py --root . --data ai_engine/training_data --approval-manifest ai_engine/training_data/source_approvals.json --profile arabic_30m --report /tmp/jon2-autonomous-brain-report.json
          status=$?
          set -e
          if [ "$status" -eq 0 ] || [ "$status" -eq 2 ]; then
            echo "Preflight completed. A blocked training result is a safe expected outcome."
          else
            exit "$status"
          fi
      - name: Upload metadata-only assessment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jon2-autonomous-engineering-assessment
          path: |
            /tmp/jon2-engineering-plan.json
            /tmp/jon2-autonomous-brain-report.json
          if-no-files-found: warn
          retention-days: 14
