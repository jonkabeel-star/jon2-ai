name: Jon2 Saved Checkpoint Evaluation

on:
  workflow_run:
    workflows: ["Jon2 Real CPU Training"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  evaluate-checkpoint:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Jon2 AI
        uses: actions/checkout@v4

      - name: Download evidence from the exact completed training run
        uses: actions/download-artifact@v4
        with:
          name: jon2-training-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: training-evidence

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download and verify the exact private checkpoint
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "::error::KAGGLE_API_TOKEN is not configured."
            exit 1
          fi
          EXPECTED_SHA="$(awk 'NR==1 {print $1}' training-evidence/checkpoint.sha256)"
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::The completed training run did not provide a valid checkpoint SHA-256."
            exit 1
          fi
          python -m pip install --upgrade pip six "kaggle>=1.8.0"
          mkdir -p /tmp/jon2-checkpoint
          # Fetch only the checkpoint file; bulk dataset downloads have
          # returned HTTP 404 while the direct file endpoint remains available.
          kaggle datasets download jon2kabeel/jon2-private-model-checkpoint -f jon2-small.pt -p /tmp/jon2-checkpoint --unzip
          CHECKPOINT="/tmp/jon2-checkpoint/jon2-small.pt"
          if [ -z "$CHECKPOINT" ]; then
            echo "::error::The private Kaggle dataset does not contain jon2-small.pt."
            exit 1
          fi
          ACTUAL_SHA="$(sha256sum "$CHECKPOINT" | awk '{print $1}')"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Kaggle checkpoint SHA-256 does not match training run ${{ github.event.workflow_run.id }}."
            echo "expected_sha256=$EXPECTED_SHA"
            echo "actual_sha256=$ACTUAL_SHA"
            exit 1
          fi
          echo "JON2_CHECKPOINT_FILE=$CHECKPOINT" >> "$GITHUB_ENV"
          echo "EXPECTED_CHECKPOINT_SHA=$EXPECTED_SHA" >> "$GITHUB_ENV"
          echo "UPSTREAM_TRAINING_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"
          echo "Verified checkpoint from training run ${{ github.event.workflow_run.id }}."

      - name: Install CPU PyTorch
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Generate all 40 held-out Arabic answers
        run: |
          set -euo pipefail
          mkdir -p training-output
          PYTHONPATH="$GITHUB_WORKSPACE/ai_engine" python ai_engine/evaluate_model.py \
            --checkpoint "$JON2_CHECKPOINT_FILE" \
            --prompts ai_engine/evaluation/prompts_ar.jsonl \
            --max-new-chars 180 \
            --temperature 0.8 \
            --seed 42 \
            --device cpu \
            --expected-prompt-count 40 \
            --training-run-id "$UPSTREAM_TRAINING_RUN_ID" \
            --checkpoint-sha256 "$EXPECTED_CHECKPOINT_SHA" \
            --output training-output/review-report.json 2>&1 | tee training-output/human-review-generation.log
          test -s training-output/review-report.json

      - name: Upload the 40-answer human-review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jon2-arabic-checkpoint-evaluation
          path: |
            training-output/review-report.json
            training-output/human-review-generation.log
          if-no-files-found: warn
          retention-days: 14
