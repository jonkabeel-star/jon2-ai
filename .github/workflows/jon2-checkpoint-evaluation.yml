name: Jon2 Saved Checkpoint Evaluation

on:
  workflow_run:
    workflows: ["Jon2 Real CPU Training"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-checkpoint:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Jon2 AI
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the private saved checkpoint from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "::error::KAGGLE_API_TOKEN is not configured."
            exit 1
          fi
          python -m pip install --upgrade pip
          python -m pip install --upgrade six
          python -m pip install --upgrade "kaggle>=1.8.0"
          python -c "import six; print('six dependency OK:', six.__version__)"
          mkdir -p /tmp/jon2-checkpoint
          kaggle datasets download -d jon2kabeel/jon2-private-model-checkpoint -p /tmp/jon2-checkpoint --unzip
          CHECKPOINT="$(find /tmp/jon2-checkpoint -type f -name 'jon2-small.pt' -print -quit)"
          if [ -z "$CHECKPOINT" ]; then
            echo "::error::The private Kaggle dataset does not contain jon2-small.pt."
            find /tmp/jon2-checkpoint -maxdepth 3 -type f -print
            exit 1
          fi
          echo "JON2_CHECKPOINT_FILE=$CHECKPOINT" >> "$GITHUB_ENV"
          sha256sum "$CHECKPOINT"
          ls -lh "$CHECKPOINT"

      - name: Install CPU PyTorch and numerical runtime dependency
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Arabic inference checks
        run: |
          set -euo pipefail
          CHECKPOINT="$(find /tmp/jon2-checkpoint -type f -name 'jon2-small.pt' -print -quit)"
          test -n "$CHECKPOINT"
          JON2_CHECKPOINT_FILE="$CHECKPOINT" PYTHONPATH="$GITHUB_WORKSPACE/ai_engine" python - <<'PY' | tee jon2-evaluation.txt
          import os
          import re
          from pathlib import Path
          import torch
          from jon2_core import load_model, generate

          checkpoint_path = Path(os.environ["JON2_CHECKPOINT_FILE"])
          checkpoint = torch.load(checkpoint_path, map_location="cpu", weights_only=True)
          print("JON2 CHECKPOINT EVALUATION")
          print("checkpoint_bytes:", checkpoint_path.stat().st_size)
          print("training_steps:", checkpoint.get("training_steps", "unknown"))
          print("corpus_characters:", checkpoint.get("corpus_characters", "unknown"))
          print("model_name:", checkpoint.get("model_name", "unknown"))
          print("torch:", torch.__version__)
          required = {"model_state", "tokenizer", "config"}
          missing = sorted(required.difference(checkpoint))
          if missing:
              raise SystemExit(f"Checkpoint is missing required fields: {missing}")
          print("config:", checkpoint["config"])
          model, tokenizer, device = load_model(str(checkpoint_path), device="cpu")
          parameter_count = sum(parameter.numel() for parameter in model.parameters())
          non_finite = sum(
              int(not torch.isfinite(parameter).all().item())
              for parameter in model.parameters()
          )
          print("parameter_count:", parameter_count)
          print("non_finite_parameter_tensors:", non_finite)
          if non_finite:
              raise SystemExit("Checkpoint contains NaN or infinite model parameters.")

          prompts = [
              "المستخدم: مرحباً، من أنت؟\nJon2:",
              "المستخدم: اشرح لي ما هو الذكاء الاصطناعي بكلمات بسيطة.\nJon2:",
              "المستخدم: لماذا تتغير الفصول الأربعة؟\nJon2:",
              "المستخدم: اكتب ثلاث نصائح لتنظيم الوقت.\nJon2:",
              "المستخدم: ما الفرق بين الإنترنت والويب؟\nJon2:",
              "المستخدم: اكتب قصة قصيرة عن أرنب يساعد أصدقاءه.\nJon2:",
          ]

          results = []
          for index, prompt in enumerate(prompts, 1):
              answer = generate(
                  model, tokenizer, prompt, device,
                  max_new_chars=220,
                  temperature=0.8,
                  stop_sequences=["المستخدم:"],
                  do_sample=False,
                  repetition_penalty=1.12,
                  no_repeat_ngram_size=3,
                  top_k=0,
              ).removeprefix(prompt).strip()
              arabic_chars = len(re.findall(r"[\u0600-\u06FF]", answer))
              words = re.findall(r"\S+", answer)
              unique_ratio = len(set(words)) / max(1, len(words))
              replacement_chars = answer.count("\uFFFD")
              allowed_script = bool(re.fullmatch(r"[\u0600-\u06FF\s،؛؟.!…ـ0-9٠-٩()«»\"'\-]+", answer))
              visible_chars = [char for char in answer if not char.isspace()]
              arabic_ratio = arabic_chars / max(1, len(visible_chars))
              print(f"\n--- TEST {index} ---")
              print("QUESTION:", prompt.splitlines()[0].replace("المستخدم: ", ""))
              print("ANSWER:", answer if answer else "[EMPTY]")
              print("CHARS:", len(answer), "ARABIC_CHARS:", arabic_chars,
                    "ARABIC_RATIO:", round(arabic_ratio, 3),
                    "ALLOWED_ARABIC_SCRIPT:", allowed_script,
                    "UNIQUE_WORD_RATIO:", round(unique_ratio, 3),
                    "REPLACEMENT_CHARS:", replacement_chars)
              results.append({
                  "nonempty": bool(answer),
                  "replacement_free": replacement_chars == 0,
                  "has_arabic": arabic_chars > 0,
                  "allowed_script": allowed_script,
                  "arabic_ratio": arabic_ratio >= 0.70,
                  "length": len(answer),
              })

          passed = sum(
              x["nonempty"] and x["replacement_free"] and x["has_arabic"]
              and x["allowed_script"] and x["arabic_ratio"]
              for x in results
          )
          print("\nTECHNICAL_CHECKS:", passed, "/", len(results))
          print("QUALITY_STATUS: HUMAN_REVIEW_REQUIRED")
          if passed != len(results):
              raise SystemExit(
                  "Checkpoint failed the Arabic output-quality gate: empty, invalid, "
                  "non-Arabic-script, or low-Arabic-ratio response detected."
              )
          PY

      - name: Generate 40-prompt Arabic human-review report
        run: |
          set -euo pipefail
          mkdir -p training-output
          PYTHONPATH="$GITHUB_WORKSPACE/ai_engine" python ai_engine/evaluate_model.py \
            --checkpoint "$JON2_CHECKPOINT_FILE" \
            --prompts ai_engine/evaluation/prompts_ar.jsonl \
            --max-new-chars 180 \
            --temperature 0.8 \
            --seed 42 \
            --device cpu \
            --output training-output/review-report.json 2>&1 | tee training-output/human-review-generation.log
          test -s training-output/review-report.json

      - name: Upload evaluation transcript and human-review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jon2-arabic-checkpoint-evaluation
          path: |
            jon2-evaluation.txt
            training-output/review-report.json
            training-output/human-review-generation.log
          if-no-files-found: ignore
          retention-days: 14
