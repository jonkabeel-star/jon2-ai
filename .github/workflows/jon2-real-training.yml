name: Jon2 Real CPU Training

on:
  # Training is intentionally manual-only. A run must be explicitly confirmed
  # with the exact input checked by the job condition below.
  workflow_dispatch:
    inputs:
      confirm_legacy_training:
        description: "Type RUN_LEGACY_269K_EXPERIMENT only after reviewing the current checkpoint and corpus."
        required: true
        default: "NO"
        type: string

# Never run two costly training jobs at the same time. Keep the active run alive.
concurrency:
  group: jon2-original-training-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  train-original-jon2:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_legacy_training == 'RUN_LEGACY_269K_EXPERIMENT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out Jon2 source and approved training corpus
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Verify private checkpoint destination
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo "::error::KAGGLE_API_TOKEN is missing; refusing to train without private checkpoint storage."
            exit 1
          fi
          python -m pip install --upgrade six
          python -m pip install --upgrade kaggle
          mkdir -p /tmp/jon2-private-dataset
          kaggle datasets metadata -d jon2kabeel/jon2-private-model-checkpoint -p /tmp/jon2-private-dataset
          test -s /tmp/jon2-private-dataset/dataset-metadata.json
          python - <<'PY'
          import json
          from pathlib import Path
          metadata = json.loads(Path("/tmp/jon2-private-dataset/dataset-metadata.json").read_text())
          if not isinstance(metadata, dict):
              raise SystemExit("Downloaded Kaggle metadata is not a JSON object.")
          dataset_ref = "jon2kabeel/jon2-private-model-checkpoint"
          # Resolve the numeric Kaggle dataset ID as well as retaining the slug.
          # This avoids CLI-version differences when parsing version metadata.
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi()
          api.authenticate()
          dataset = api.dataset_view(dataset_ref)
          metadata["id"] = dataset_ref
          numeric_id = getattr(dataset, "id", None) or getattr(dataset, "id_no", None)
          if numeric_id is not None:
              metadata["id_no"] = int(numeric_id)
          if not metadata.get("id") and not metadata.get("id_no"):
              raise SystemExit("Kaggle dataset metadata has neither id nor id_no.")
          Path("/tmp/jon2-private-dataset/dataset-metadata.json").write_text(
              json.dumps(metadata, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          check = json.loads(Path("/tmp/jon2-private-dataset/dataset-metadata.json").read_text(encoding="utf-8"))
          if not check.get("id") and not check.get("id_no"):
              raise SystemExit("Version metadata preflight failed: dataset identifier is missing.")
          print("Private Kaggle dataset version metadata verified:", check.get("id"), check.get("id_no"))
          PY
          # Download each checkpoint by its exact filename. The bulk dataset
          # download endpoint intermittently returns Kaggle HTTP 404 even when
          # dataset metadata and file listings are available.
          kaggle datasets download jon2kabeel/jon2-private-model-checkpoint -f jon2-small.pt -p /tmp/jon2-private-dataset --unzip
          kaggle datasets download jon2kabeel/jon2-private-model-checkpoint -f jon2-last.pt -p /tmp/jon2-private-dataset --unzip
          test -s /tmp/jon2-private-dataset/jon2-small.pt
          test -s /tmp/jon2-private-dataset/jon2-last.pt
          mkdir -p ai_engine/checkpoints
          cp /tmp/jon2-private-dataset/jon2-small.pt ai_engine/checkpoints/jon2-small.pt
          cp /tmp/jon2-private-dataset/jon2-last.pt ai_engine/checkpoints/jon2-last.pt
          echo "Restored best and resumable checkpoints from private Kaggle storage."

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run consecutive training cycles and save every cycle to private Kaggle
        timeout-minutes: 345
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ai_engine/checkpoints training-output
          cycle=1
          started=$SECONDS
          cycle_window_seconds=19800
          while (( SECONDS - started < cycle_window_seconds )); do
            echo "===== JON2 TRAINING CYCLE ${cycle} ====="
            PYTHONPATH=ai_engine python ai_engine/train_jon2.py \
              --data ai_engine/training_data \
              --approval-manifest ai_engine/training_data/source_approvals.json \
              --output ai_engine/checkpoints/jon2-small.pt \
              --last-checkpoint ai_engine/checkpoints/jon2-last.pt \
              --steps 5000 \
              --resume ai_engine/checkpoints/jon2-last.pt \
              --additional-steps 5000 \
              --reset-early-stopping \
              --batch-size 8 \
              --context 128 \
              --width 96 \
              --heads 4 \
              --layers 2 \
              --dropout 0.1 \
              --learning-rate 0.0003 \
              --weight-decay 0.1 \
              --warmup-steps 250 \
              --validation-fraction 0.1 \
              --eval-steps 16 \
              --eval-every 250 \
              --patience 8 \
              --min-delta 0.0005 \
              --grad-clip 1.0 \
              --minimum-chars 100000 \
              --tokenizer-vocab-size 512 \
              --tokenizer-min-frequency 2 \
              --seed 42 \
              --keep-last 2>&1 | tee "training-output/training-cycle-${cycle}.log"
            test -s ai_engine/checkpoints/jon2-small.pt
            test -s ai_engine/checkpoints/jon2-last.pt
            cp ai_engine/checkpoints/jon2-small.pt /tmp/jon2-private-dataset/
            cp ai_engine/checkpoints/jon2-last.pt /tmp/jon2-private-dataset/
            # Preserve immutable, run-specific checkpoint copies and provenance
            # before updating the private dataset's latest-file aliases.
            export JON2_TRAINING_CYCLE="${cycle}"
            run_stamp="${GITHUB_RUN_ID:-local}-attempt-${GITHUB_RUN_ATTEMPT:-1}-cycle-${cycle}"
            cp ai_engine/checkpoints/jon2-small.pt "/tmp/jon2-private-dataset/jon2-legacy-${run_stamp}-best.pt"
            cp ai_engine/checkpoints/jon2-last.pt "/tmp/jon2-private-dataset/jon2-legacy-${run_stamp}-resume.pt"
            python - "${run_stamp}" <<'PY'
            import hashlib
            import json
            import os
            import sys
            from pathlib import Path

            root = Path("/tmp/jon2-private-dataset")
            stamp = sys.argv[1]
            files = {}
            for label, name in (
                ("best", f"jon2-legacy-{stamp}-best.pt"),
                ("resume", f"jon2-legacy-{stamp}-resume.pt"),
            ):
                path = root / name
                raw = path.read_bytes()
                files[label] = {
                    "filename": name,
                    "size_bytes": len(raw),
                    "sha256": hashlib.sha256(raw).hexdigest(),
                }
            manifest = {
                "format": "jon2-checkpoint-manifest-v1",
                "training_line": "legacy_original_transformer",
                "warning": "This workflow is not the arabic_30m profile and does not produce a 30M model.",
                "github_run_id": os.environ.get("GITHUB_RUN_ID"),
                "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
                "github_sha": os.environ.get("GITHUB_SHA"),
                "cycle": int(os.environ.get("JON2_TRAINING_CYCLE", "0") or 0),
                "files": files,
            }
            destination = root / f"jon2-checkpoint-manifest-{stamp}.json"
            destination.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
            print(json.dumps(manifest, ensure_ascii=False, indent=2))
            PY
            save_ok=0
            for attempt in 1 2 3 4; do
              echo "Saving cycle ${cycle} to private Kaggle (attempt ${attempt}/4)..."
              if kaggle datasets version -p /tmp/jon2-private-dataset -m "Jon2 consecutive training cycle ${cycle}" 2>&1 | tee "training-output/kaggle-save-cycle-${cycle}-attempt-${attempt}.log"; then
                save_ok=1
                break
              fi
              if (( attempt < 4 )); then
                delay=$((attempt * 60))
                echo "Kaggle version creation failed; retrying in ${delay} seconds."
                sleep "${delay}"
              fi
            done
            if (( save_ok == 0 )); then
              echo "::error::Kaggle rejected all 4 checkpoint-version attempts for cycle ${cycle}. See training-output/kaggle-save-cycle-${cycle}-attempt-*.log."
              exit 1
            fi
            echo "Cycle ${cycle} checkpoint version confirmed by Kaggle; starting the next cycle automatically."
            sleep 30
            cycle=$((cycle + 1))
          done
          sha256sum ai_engine/checkpoints/jon2-small.pt | tee training-output/checkpoint.sha256
          sha256sum ai_engine/checkpoints/jon2-last.pt | tee training-output/checkpoint-resume.sha256
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          entries = {}
          for label, filename in (
              ("best", "ai_engine/checkpoints/jon2-small.pt"),
              ("resume", "ai_engine/checkpoints/jon2-last.pt"),
          ):
              path = Path(filename)
              raw = path.read_bytes()
              entries[label] = {
                  "filename": path.name,
                  "size_bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              }
          Path("training-output/checkpoint-manifest.json").write_text(
              json.dumps({
                  "format": "jon2-checkpoint-manifest-v1",
                  "training_line": "legacy_original_transformer",
                  "warning": "Not the arabic_30m profile.",
                  "files": entries,
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          ls -lh ai_engine/checkpoints/jon2-small.pt ai_engine/checkpoints/jon2-last.pt
          echo "Consecutive cycle window ended safely. No automatic follow-up training is configured."

      - name: Load checkpoint and run real CPU inference smoke test
        run: |
          set -euo pipefail
          PYTHONPATH=ai_engine python - <<'PY' | tee training-output/inference-smoke-test.log
          import torch
          from jon2_core import load_model, generate

          path = "ai_engine/checkpoints/jon2-small.pt"
          checkpoint = torch.load(path, map_location="cpu", weights_only=True)
          model, tokenizer, device = load_model(path, device="cpu")
          params = sum(p.numel() for p in model.parameters())
          finite = all(torch.isfinite(p).all().item() for p in model.parameters())
          print("checkpoint_training_steps:", checkpoint.get("training_steps"))
          print("checkpoint_corpus_characters:", checkpoint.get("corpus_characters"))
          print("checkpoint_validation_fraction:", checkpoint.get("validation_fraction"))
          print("model_parameters:", params)
          print("all_parameters_finite:", finite)
          if not finite:
              raise SystemExit("Non-finite model weights detected")
          for prompt in [
              "المستخدم: مرحباً، من أنت؟\nJon2:",
              "المستخدم: اشرح الذكاء الاصطناعي ببساطة.\nJon2:",
          ]:
              answer = generate(
                  model, tokenizer, prompt, device,
                  max_new_chars=80, do_sample=False,
                  repetition_penalty=1.10, no_repeat_ngram_size=3,
                  stop_sequences=["المستخدم:"],
              ).removeprefix(prompt).strip()
              print("\nPROMPT:", prompt.splitlines()[0])
              print("GENERATED_OUTPUT:", answer or "[empty output]")
          print("\nSMOKE_TEST: checkpoint loaded and inference executed on CPU.")
          print("QUALITY_STATUS: HUMAN_REVIEW_REQUIRED")
          PY

      - name: Run held-out Arabic quality diagnostics
        run: |
          set -euo pipefail
          PYTHONPATH=ai_engine python ai_engine/evaluate_checkpoint.py \
            --checkpoint ai_engine/checkpoints/jon2-small.pt \
            --output training-output/arabic-evaluation.json \
            --max-new-chars 180
          echo "Automatic diagnostics completed; semantic quality remains subject to human review."

      - name: Store trained weights in the private Kaggle dataset
        if: success()
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          cp ai_engine/checkpoints/jon2-small.pt /tmp/jon2-private-dataset/
          if [ -s ai_engine/checkpoints/jon2-last.pt ]; then
            cp ai_engine/checkpoints/jon2-last.pt /tmp/jon2-private-dataset/
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/jon2-private-dataset/dataset-metadata.json")
          metadata = json.loads(p.read_text(encoding="utf-8"))
          if not isinstance(metadata, dict):
              raise SystemExit("Kaggle dataset metadata must be a JSON object.")
          dataset_ref = "jon2kabeel/jon2-private-model-checkpoint"
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi()
          api.authenticate()
          dataset = api.dataset_view(dataset_ref)
          metadata["id"] = dataset_ref
          numeric_id = getattr(dataset, "id", None) or getattr(dataset, "id_no", None)
          if numeric_id is not None:
              metadata["id_no"] = int(numeric_id)
          metadata.setdefault("title", "Jon2 Private Model Checkpoint")
          metadata.setdefault("description", "Private internal storage for Jon2 AI model checkpoints. Not licensed for public redistribution.")
          if not metadata.get("licenses"):
              metadata["licenses"] = [{"name": "other"}]
          if not metadata.get("id") and not metadata.get("id_no"):
              raise SystemExit("Kaggle version metadata is missing id/id_no.")
          p.write_text(json.dumps(metadata, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          verified = json.loads(p.read_text(encoding="utf-8"))
          assert verified.get("id") or verified.get("id_no"), "dataset identifier missing after write"
          print("Prepared and verified Kaggle metadata:", verified.get("id"), verified.get("id_no"))
          PY
          kaggle datasets version -p /tmp/jon2-private-dataset -m "Jon2 original Arabic Transformer CPU training"
          echo "Private checkpoint dataset version updated."

      - name: Upload non-sensitive training evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jon2-training-evidence
          path: training-output/
          if-no-files-found: warn
          retention-days: 7
