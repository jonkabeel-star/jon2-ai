name: Jon2 Knowledge Retrieval Tests

on:
  push:
    branches: [main]
    paths:
      - "ai_engine/knowledge_engine.py"
      - "ai_engine/tests/test_knowledge_engine.py"
      - "ai_engine/tests/test_multilingual_research.py"
      - "ai_engine/tests/test_chat_knowledge_integration.py"
      - "ai_engine/main.py"
      - ".github/workflows/jon2-knowledge-tests.yml"
  pull_request:
    paths:
      - "ai_engine/knowledge_engine.py"
      - "ai_engine/tests/test_knowledge_engine.py"
      - "ai_engine/tests/test_multilingual_research.py"
      - "ai_engine/tests/test_chat_knowledge_integration.py"
      - "ai_engine/main.py"
      - ".github/workflows/jon2-knowledge-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  knowledge-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight API test dependencies
        run: python -m pip install "fastapi>=0.110,<1" "pydantic>=2,<3"

      - name: Compile knowledge and API modules
        run: |
          python -m py_compile ai_engine/knowledge_engine.py ai_engine/main.py

      - name: Run offline knowledge cache and chat integration tests
        env:
          PYTHONPATH: ai_engine
        run: |
          python -m unittest discover -s ai_engine/tests -p "test_knowledge_engine.py" -v
          python -m unittest discover -s ai_engine/tests -p "test_multilingual_research.py" -v
          python -m unittest discover -s ai_engine/tests -p "test_chat_knowledge_integration.py" -v
