name: Jon2 AI Code Checks

on:
  push:
    paths:
      - "server/**"
      - "ai_engine/**"
      - "requirements.txt"
      - ".github/workflows/server-check.yml"
  pull_request:
    paths:
      - "server/**"
      - "ai_engine/**"
      - "requirements.txt"
      - ".github/workflows/server-check.yml"

permissions:
  contents: read

jobs:
  python-and-node:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch for original-model tests
        run: python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
      - name: Check Python syntax
        run: python -m compileall -q ai_engine
      - name: Audit training text structure
        run: python ai_engine/audit_data.py
      - name: Test data audit helpers and original model
        run: python -m unittest discover -s ai_engine -p 'test_*.py'
      - name: Test private corpus audit utility
        run: python -m unittest discover -s ai_engine/scratch -p 'test_*.py'
      - name: Verify original Jon2 model foundation
        run: python ai_engine/scratch/verify_foundation.py
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: |
          node --check server/server.js
          node --check server/auth.js
          node --check server/migrate.js
      - name: Validate package manifest
        run: node -e "JSON.parse(require('fs').readFileSync('server/package.json', 'utf8')); console.log('package.json is valid')"
