name: Qwen One-Shot Inference Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-smoke-test:
    name: Send exactly one real chat request
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the deployed Qwen test endpoint once
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          HTTP_CODE="$(curl --silent --show-error \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            --connect-timeout 15 \
            --max-time 90 \
            --request POST \
            --header "Content-Type: application/json" \
            --data '{"message":"أجب بالعربية في جملة واحدة: ما فائدة التعاون بين الأصدقاء؟"}' \
            "https://jon2-ai.jonkabeel.workers.dev/api/chat")"
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Qwen inference request failed. Response:"
            cat "$RESPONSE_FILE"
            exit 1
          fi
          python - "$RESPONSE_FILE" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as f:
              data = json.load(f)
          reply = data.get("reply")
          model = data.get("model")
          if data.get("project") != "Jon2 Cloud":
              raise SystemExit("FAIL: unexpected project identifier")
          if not isinstance(reply, str) or not reply.strip():
              raise SystemExit("FAIL: response contains no generated text")
          if model != "@cf/qwen/qwen3.8-27b":
              raise SystemExit(f"FAIL: unexpected model identifier: {model!r}")
          print("RESULT: PASS — one real inference response received.")
          print("MODEL (test only):", model)
          print("REPLY:", reply.strip())
          print("NOTICE: This is Qwen infrastructure testing, not the original Jon2 model.")
          PY
          rm -f "$RESPONSE_FILE"
