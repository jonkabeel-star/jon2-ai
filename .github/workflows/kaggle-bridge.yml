name: Jon2 AI Kaggle Bridge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kaggle-bridge.yml"
      - "kaggle/hello-jon2/**"
      - "ai_engine/**"
  workflow_dispatch:
    inputs:
      kernel_dir:
        description: "Repository folder containing kernel-metadata.json and notebook"
        required: true
        default: "kaggle/hello-jon2"
        type: string

permissions:
  contents: read

concurrency:
  group: jon2-kaggle-bridge
  cancel-in-progress: false

jobs:
  validate-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Kaggle API token is configured
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Add KAGGLE_API_TOKEN as a repository Actions secret."
            exit 1
          fi

      - name: Validate notebook metadata
        env:
          KERNEL_DIR: kaggle/hello-jon2
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["KERNEL_DIR"]).resolve()
          repo = Path.cwd().resolve()
          if repo not in root.parents and root != repo:
              raise SystemExit("Kernel directory must be inside the repository.")
          metadata = root / "kernel-metadata.json"
          if not metadata.is_file():
              raise SystemExit(f"Missing {metadata}")
          data = json.loads(metadata.read_text(encoding="utf-8"))
          for key in ("id", "code_file", "language", "kernel_type"):
              if not data.get(key):
                  raise SystemExit(f"Missing required metadata field: {key}")
          if "jon2kabeel/jon2-approved-training-data-v2" not in data.get("dataset_sources", []):
              raise SystemExit("Notebook must attach the private approved training dataset.")
          code = root / data["code_file"]
          if not code.is_file():
              raise SystemExit(f"Notebook file not found: {code}")
          print(f"Validated Kaggle kernel: {data['id']}")
          PY

      - name: Install Kaggle CLI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade six "kaggle>=1.8.0"

      - name: Package approved source files and publish private training dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          DATASET_DIR=/tmp/jon2-approved-dataset
          mkdir -p "$DATASET_DIR/ai_engine/training_data"
          cp ai_engine/jon2_core.py ai_engine/train_jon2.py ai_engine/tokenizer.py ai_engine/source_approval.py "$DATASET_DIR/ai_engine/"
          cp ai_engine/training_data/original_dialogue_ar_batch_01.txt "$DATASET_DIR/ai_engine/training_data/"
          cp ai_engine/training_data/original_dialogue_ar_batch_02.txt "$DATASET_DIR/ai_engine/training_data/"
          cp ai_engine/training_data/original_dialogue_ar_batch_03.txt "$DATASET_DIR/ai_engine/training_data/"
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("/tmp/jon2-approved-dataset/ai_engine/training_data")
          files = sorted(root.glob("*.txt"))
          if len(files) != 3:
              raise SystemExit(f"Expected exactly 3 approved dialogue batches, found {len(files)}")
          records = []
          for path in files:
              raw = path.read_bytes()
              text = raw.decode("utf-8", errors="strict")
              if len(text.strip()) < 1000:
                  raise SystemExit(f"Unexpectedly short source: {path.name}")
              records.append({
                  "file": path.name,
                  "sha256": hashlib.sha256(raw).hexdigest(),
                  "character_count": len(text),
                  "status": "APPROVED",
                  "reviewer": "Repository owner — explicit approval for batches 01, 02, and 03 research training only",
                  "review_date": "2026-11-04",
                  "rights_basis": "Original project-authored Arabic dialogue created for Jon2 AI. No private conversations or copied third-party dataset text. This records owner approval for research training only, not a legal guarantee.",
                  "intended_use": "research_training"
              })
          (root / "source_approvals.json").write_text(
              json.dumps({"approved_sources": records}, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print("Approved source characters:", sum(x["character_count"] for x in records))
          print("Approved source files:", [x["file"] for x in records])
          PY
          cat > "$DATASET_DIR/dataset-metadata.json" <<'JSON'
          {
            "title": "Jon2 AI Approved Arabic Training Sources",
            "id": "jon2kabeel/jon2-approved-training-data-v2",
            "licenses": [{"name": "other"}]
          }
          JSON
          if kaggle datasets create -p "$DATASET_DIR" -r zip; then
            echo "::notice::Created private approved-source dataset."
          else
            echo "Dataset may already exist; attempting a version update."
            kaggle datasets version -p "$DATASET_DIR" -m "Update approved Jon2 Arabic training sources" -q
          fi

      - name: Push notebook to Kaggle and start execution
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KERNEL_DIR: kaggle/hello-jon2
        run: kaggle kernels push -p "$KERNEL_DIR"

      - name: Wait for Kaggle execution and collect logs
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set +e
          for attempt in $(seq 1 150); do
            STATUS="$(kaggle kernels status jon2kabeel/hello-jon2 2>&1)"
            STATUS_CODE=$?
            echo "Kaggle status check $attempt/150:"
            echo "$STATUS"
            if [ $STATUS_CODE -eq 0 ] && echo "$STATUS" | grep -Eqi 'COMPLETE|COMPLETED'; then
              echo "::notice::Kaggle notebook execution completed."
              kaggle kernels logs jon2kabeel/hello-jon2
              exit $?
            fi
            if echo "$STATUS" | grep -Eqi 'KernelWorkerStatus.ERROR|status [" ]*ERROR|ERRORED'; then
              echo "::error::Kaggle notebook execution failed. Latest logs:"
              kaggle kernels logs jon2kabeel/hello-jon2
              exit 1
            fi
            sleep 20
          done
          echo "::error::Kaggle execution did not reach COMPLETE within fifty minutes."
          exit 1

      - name: Download and verify the trained checkpoint
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/jon2-kernel-output
          kaggle kernels output jon2kabeel/hello-jon2 -p /tmp/jon2-kernel-output
          CHECKPOINT="$(find /tmp/jon2-kernel-output -type f -name 'jon2-small.pt' -print -quit)"
          if [ -z "$CHECKPOINT" ]; then
            echo "::error::Kaggle output did not contain jon2-small.pt"
            find /tmp/jon2-kernel-output -maxdepth 4 -type f -print
            exit 1
          fi
          test "$(stat -c%s "$CHECKPOINT")" -gt 100000
          mkdir -p /tmp/jon2-private-weights
          cp "$CHECKPOINT" /tmp/jon2-private-weights/jon2-small.pt
          sha256sum /tmp/jon2-private-weights/jon2-small.pt
          cat > /tmp/jon2-private-weights/dataset-metadata.json <<'JSON'
          {
            "title": "Jon2 AI Private Model Checkpoint",
            "id": "jon2kabeel/jon2-private-model-checkpoint",
            "licenses": [{"name": "other"}]
          }
          JSON

      - name: Store checkpoint in a private Kaggle dataset
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          if kaggle datasets create -p /tmp/jon2-private-weights -r zip; then
            echo "::notice::Created private Kaggle checkpoint dataset."
          else
            kaggle datasets version -p /tmp/jon2-private-weights -m "Update private Jon2 checkpoint" -q
          fi
