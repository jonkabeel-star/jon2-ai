name: Jon2 RTL compile check

on:
  push:
    paths:
      - "hardware/rtl/**"
      - ".github/workflows/jon2-rtl-check.yml"
  pull_request:
    paths:
      - "hardware/rtl/**"
      - ".github/workflows/jon2-rtl-check.yml"
  workflow_dispatch:

jobs:
  compile-rv32i-control:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile control unit and dependencies
        run: |
          iverilog -g2012 -Wall -s jon2_control_unit -o /tmp/jon2-control.vvp \
            hardware/rtl/jon2_decoder.sv \
            hardware/rtl/jon2_immediate_gen.sv \
            hardware/rtl/jon2_control_unit.sv
