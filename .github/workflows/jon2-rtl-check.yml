name: Jon2 RTL compile and smoke tests

on:
  push:
    paths:
      - "hardware/rtl/**"
      - "hardware/tb/**"
      - ".github/workflows/jon2-rtl-check.yml"
  pull_request:
    paths:
      - "hardware/rtl/**"
      - "hardware/tb/**"
      - ".github/workflows/jon2-rtl-check.yml"
  workflow_dispatch:

jobs:
  rtl-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog
      - name: Compile ALU
        run: |
          iverilog -g2012 -Wall -s jon2_alu -o /tmp/jon2-alu.vvp hardware/rtl/jon2_alu.sv
      - name: Run ALU smoke test
        run: |
          iverilog -g2012 -Wall -s tb_jon2_alu -o /tmp/jon2-alu-test.vvp \
            hardware/rtl/jon2_alu.sv hardware/tb/tb_jon2_alu.sv
          vvp /tmp/jon2-alu-test.vvp
      - name: Compile register file
        run: |
          iverilog -g2012 -Wall -s jon2_register_file -o /tmp/jon2-register-file.vvp hardware/rtl/jon2_register_file.sv
      - name: Run register file smoke test
        run: |
          iverilog -g2012 -Wall -s tb_jon2_register_file -o /tmp/jon2-register-file-test.vvp \
            hardware/rtl/jon2_register_file.sv hardware/tb/tb_jon2_register_file.sv
          vvp /tmp/jon2-register-file-test.vvp
      - name: Compile integrated Jon2 core
        run: |
          iverilog -g2012 -Wall -s jon2_core -o /tmp/jon2-core.vvp \
            hardware/rtl/jon2_pc.sv \
            hardware/rtl/jon2_instruction_memory.sv \
            hardware/rtl/jon2_fetch_unit.sv \
            hardware/rtl/jon2_decoder.sv \
            hardware/rtl/jon2_immediate_gen.sv \
            hardware/rtl/jon2_control_unit.sv \
            hardware/rtl/jon2_register_file.sv \
            hardware/rtl/jon2_alu.sv \
            hardware/rtl/jon2_data_memory.sv \
            hardware/rtl/jon2_core.sv
      - name: Run integrated core program
        run: |
          iverilog -g2012 -Wall -s tb_jon2_core -o /tmp/jon2-core-test.vvp \
            hardware/rtl/jon2_pc.sv \
            hardware/rtl/jon2_instruction_memory.sv \
            hardware/rtl/jon2_fetch_unit.sv \
            hardware/rtl/jon2_decoder.sv \
            hardware/rtl/jon2_immediate_gen.sv \
            hardware/rtl/jon2_control_unit.sv \
            hardware/rtl/jon2_register_file.sv \
            hardware/rtl/jon2_alu.sv \
            hardware/rtl/jon2_data_memory.sv \
            hardware/rtl/jon2_core.sv \
            hardware/tb/tb_jon2_core.sv
          vvp /tmp/jon2-core-test.vvp
      - name: Compile control unit and dependencies
        run: |
          iverilog -g2012 -Wall -s jon2_control_unit -o /tmp/jon2-control.vvp \
            hardware/rtl/jon2_decoder.sv \
            hardware/rtl/jon2_immediate_gen.sv \
            hardware/rtl/jon2_control_unit.sv
      - name: Compile data memory
        run: |
          iverilog -g2012 -Wall -s jon2_data_memory -o /tmp/jon2-memory.vvp \
            hardware/rtl/jon2_data_memory.sv
      - name: Run data memory smoke test
        run: |
          iverilog -g2012 -Wall -s tb_jon2_data_memory -o /tmp/jon2-memory-test.vvp \
            hardware/rtl/jon2_data_memory.sv \
            hardware/tb/tb_jon2_data_memory.sv
          vvp /tmp/jon2-memory-test.vvp
      - name: Compile instruction memory
        run: |
          iverilog -g2012 -Wall -s jon2_instruction_memory -o /tmp/jon2-instruction-memory.vvp \
            hardware/rtl/jon2_instruction_memory.sv
      - name: Run instruction memory smoke test
        run: |
          iverilog -g2012 -Wall -s tb_jon2_instruction_memory -o /tmp/jon2-instruction-test.vvp \
            hardware/rtl/jon2_instruction_memory.sv \
            hardware/tb/tb_jon2_instruction_memory.sv
          vvp /tmp/jon2-instruction-test.vvp
      - name: Compile instruction fetch unit
        run: |
          iverilog -g2012 -Wall -s jon2_fetch_unit -o /tmp/jon2-fetch.vvp \
            hardware/rtl/jon2_pc.sv \
            hardware/rtl/jon2_instruction_memory.sv \
            hardware/rtl/jon2_fetch_unit.sv
      - name: Run instruction fetch smoke test
        run: |
          iverilog -g2012 -Wall -s tb_jon2_fetch_unit -o /tmp/jon2-fetch-test.vvp \
            hardware/rtl/jon2_pc.sv \
            hardware/rtl/jon2_instruction_memory.sv \
            hardware/rtl/jon2_fetch_unit.sv \
            hardware/tb/tb_jon2_fetch_unit.sv
          vvp /tmp/jon2-fetch-test.vvp
