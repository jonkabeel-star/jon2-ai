name: Jais 2 adapter contract checks

on:
  push:
    branches: [main]
    paths:
      - "ai_engine/external_models/jais2_runtime.py"
      - "ai_engine/external_models/download_approved_checkpoint.py"
      - "ai_engine/external_models/test_checkpoint_downloader.py"
      - "ai_engine/external_models/STEP3_WEIGHT_ACQUISITION.md"
      - "ai_engine/external_models/test_jais2_runtime.py"
      - "ai_engine/external_models/jais2_routes.py"
      - "ai_engine/external_models/test_jais2_routes.py"
      - "ai_engine/main.py"
      - "ai_engine/external_models/evaluation/**"
      - ".github/workflows/jais2-adapter-check.yml"
  pull_request:
    paths:
      - "ai_engine/external_models/jais2_runtime.py"
      - "ai_engine/external_models/download_approved_checkpoint.py"
      - "ai_engine/external_models/test_checkpoint_downloader.py"
      - "ai_engine/external_models/STEP3_WEIGHT_ACQUISITION.md"
      - "ai_engine/external_models/test_jais2_runtime.py"
      - "ai_engine/external_models/jais2_routes.py"
      - "ai_engine/external_models/test_jais2_routes.py"
      - "ai_engine/main.py"
      - "ai_engine/external_models/evaluation/**"
      - ".github/workflows/jais2-adapter-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install API test dependency
        run: python -m pip install "fastapi==0.162.0"
      - name: Compile adapter and tests
        run: python -m compileall -q ai_engine/external_models
      - name: Run offline contract tests
        run: python -m unittest discover -s ai_engine/external_models -p 'test_*.py' -v
      - name: Validate Arabic evaluation suite (no model required)
        run: python ai_engine/external_models/evaluation/run_evaluation.py --validate-only
