name: Jon2 AI Container Build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "ai_engine/**"
      - ".github/workflows/jon2-container-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "ai_engine/**"
      - ".github/workflows/jon2-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cpu-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build CPU-only Jon2 API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: jon2-ai-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
