name: Jon2 AI Container Build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "ai_engine/**"
      - ".github/workflows/jon2-container-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "ai_engine/**"
      - ".github/workflows/jon2-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cpu-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build CPU-only Jon2 API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: jon2-ai-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name jon2-api-ci -p 8000:8000 jon2-ai-api:ci
          trap 'docker rm -f jon2-api-ci >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/api/health"
          last_error = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  assert payload.get("status") == "online", payload
                  assert payload.get("chat_ready") is False, payload
                  assert payload.get("release_approved") is False, payload
                  assert payload.get("model_status") == "checkpoint_missing", payload
                  print("Container health endpoint passed; chat remains safely blocked.")
                  print(json.dumps(payload, ensure_ascii=False))
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"Container health check failed: {last_error}")

          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/chat",
              data=json.dumps({"message": "مرحبا"}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as exc:
              body = json.loads(exc.read().decode("utf-8"))
              assert exc.code == 503, (exc.code, body)
              assert "المراجعة البشرية" in body.get("detail", ""), body
              print("Chat release gate passed: POST /api/chat returns the expected HTTP 503.")
          else:
              raise SystemExit("Chat release gate failed: unapproved chat unexpectedly returned success.")
          PY
