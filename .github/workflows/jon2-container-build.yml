name: Jon2 AI Container Build

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "ai_engine/**"
      - ".github/workflows/jon2-container-build.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "ai_engine/**"
      - ".github/workflows/jon2-container-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cpu-api:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build CPU-only Jon2 API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: jon2-ai-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and verify health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name jon2-api-ci -p 8000:8000 jon2-ai-api:ci
          trap 'docker rm -f jon2-api-ci >/dev/null 2>&1 || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:8000/api/health/live"
          last_error = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  assert payload.get("status") == "alive", payload
                  model_health = json.load(urllib.request.urlopen(
                      "http://127.0.0.1:8000/api/health", timeout=5
                  ))
                  assert model_health.get("status") == "online", model_health
                  assert model_health.get("chat_ready") is False, model_health
                  assert model_health.get("release_approved") is False, model_health
                  assert model_health.get("model_status") == "checkpoint_missing", model_health
                  print("Container liveness and model health passed; chat remains safely blocked.")
                  try:
                      urllib.request.urlopen("http://127.0.0.1:8000/api/health/ready", timeout=5)
                  except urllib.error.HTTPError as exc:
                      ready_body = json.loads(exc.read().decode("utf-8"))
                      assert exc.code == 503, (exc.code, ready_body)
                      assert ready_body.get("detail", {}).get("status") == "not_ready", ready_body
                  else:
                      raise SystemExit("Readiness gate failed: unreviewed model reported ready.")
                  print("Container liveness endpoint passed; model readiness is checked separately.")
                  print(json.dumps(payload, ensure_ascii=False))

                  compute_health = json.load(urllib.request.urlopen(
                      "http://127.0.0.1:8000/api/compute/health", timeout=5
                  ))
                  assert compute_health.get("service") == "Jon2 Compute Control Plane", compute_health
                  assert compute_health.get("provisioning_status") == "not_provisioned_by_this_service", compute_health

                  resources = json.load(urllib.request.urlopen(
                      "http://127.0.0.1:8000/api/compute/resources", timeout=5
                  ))
                  assert resources.get("schema_version") == 1, resources
                  assert resources.get("capacity_class") in {
                      "cpu_only", "gpu_visible", "apple_mps_visible"
                  }, resources
                  assert "cpu" in resources and "memory" in resources, resources

                  admission = json.load(urllib.request.urlopen(
                      "http://127.0.0.1:8000/api/compute/admission?min_memory_gib=0.1&require_gpu=true",
                      timeout=5
                  ))
                  assert admission.get("execution_started") is False, admission
                  assert admission.get("gpu_required") is True, admission
                  print("Jon2 Compute API checks passed: hardware is discovered, not provisioned.")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"Container health check failed: {last_error}")

          request = urllib.request.Request(
              "http://127.0.0.1:8000/api/chat",
              data=json.dumps({"message": "مرحبا"}).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as exc:
              body = json.loads(exc.read().decode("utf-8"))
              assert exc.code == 503, (exc.code, body)
              assert "المراجعة البشرية" in body.get("detail", ""), body
              print("Chat release gate passed: POST /api/chat returns the expected HTTP 503.")
          else:
              raise SystemExit("Chat release gate failed: unapproved chat unexpectedly returned success.")
          PY

          docker exec jon2-api-ci python -m unittest \
            test_api \
            test_chat_memory \
            test_chat_engine \
            compute.test_resource_probe \
            compute.test_worker_registry \
            compute.test_worker_agent \
            compute.test_worker_routes \
            compute.test_task_contract -v

          for private_path in \
            /app/ai_engine/training_data \
            /app/ai_engine/checkpoints \
            /app/ai_engine/evaluation; do
            if docker exec jon2-api-ci test -e "$private_path"; then
              echo "::error::Private training or evaluation material was included in the runtime image: $private_path"
              exit 1
            fi
          done
          echo "Image privacy check passed: no training data, checkpoints, or evaluation material."

          python - <<'PY'
          import urllib.error
          import urllib.request

          def preflight(origin):
              request = urllib.request.Request(
                  "http://127.0.0.1:8000/api/chat",
                  headers={
                      "Origin": origin,
                      "Access-Control-Request-Method": "POST",
                      "Access-Control-Request-Headers": "content-type",
                  },
                  method="OPTIONS",
              )
              try:
                  with urllib.request.urlopen(request, timeout=5) as response:
                      return response.status, response.headers
              except urllib.error.HTTPError as error:
                  return error.code, error.headers

          allowed_status, allowed = preflight("https://jonkabeel-star.github.io")
          assert allowed_status == 200, (allowed_status, allowed)
          assert allowed.get("Access-Control-Allow-Origin") == "https://jonkabeel-star.github.io", allowed

          denied_status, denied = preflight("https://untrusted.example")
          assert denied_status == 400, (denied_status, denied)
          assert denied.get("Access-Control-Allow-Origin") is None, denied
          print("CORS checks passed: GitHub Pages origin allowed; unrelated origin rejected with HTTP 400.")
          PY

