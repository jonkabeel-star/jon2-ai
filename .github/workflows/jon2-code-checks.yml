name: Jon2 AI Code Checks

on:
  push:
    branches: [main]
    paths:
      - "ai_engine/**"
      - "scripts/**/*.py"
      - "tests/test_auto_repair.py"
      - "tests/test_error_diagnostics.py"
      - "tests/test_safe_repair_rules.py"
      - "index.html"
      - "tests/check_frontend_js.py"
      - ".github/workflows/jon2-code-checks.yml"
  pull_request:
    paths:
      - "ai_engine/**"
      - "index.html"
      - "tests/check_frontend_js.py"
      - ".github/workflows/jon2-code-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source and repair diagnostics
        run: python -m compileall -q ai_engine scripts tests
      - name: Test Auto Repair diagnostics
        run: python -m unittest discover -s tests -p 'test_error_diagnostics.py' -v
      - name: Test bounded path, symbol and dependency suggestions\n        run: python -m unittest discover -s tests -p 'test_safe_repair_rules.py' -v\n      - name: Test Auto Repair safety rules
        run: python -m unittest discover -s tests -p 'test_auto_repair.py' -v
      - name: Test source approval gate
        working-directory: ai_engine
        run: python -m unittest discover -s tests -p 'test_source_approval.py' -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check static website JavaScript syntax
        run: python tests/check_frontend_js.py index.html
