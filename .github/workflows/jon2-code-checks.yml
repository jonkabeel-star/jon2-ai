name: Jon2 AI Code Checks

on:
  push:
    branches: [main]
    paths:
      - "ai_engine/**"
      - "server/**"
      - "cloudflare/**"
      - "wrangler.toml"
      - "index.html"
      - "jon2-config.js"
      - "tests/**"
      - ".github/workflows/jon2-code-checks.yml"
  pull_request:
    paths:
      - "ai_engine/**"
      - "server/**"
      - "cloudflare/**"
      - "wrangler.toml"
      - "index.html"
      - "jon2-config.js"
      - "tests/**"
      - ".github/workflows/jon2-code-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m compileall -q ai_engine
      - name: Test source approval gate
        working-directory: ai_engine
        run: python -m unittest discover -s tests -p 'test_source_approval.py' -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check static website JavaScript syntax
        run: python tests/check_frontend_js.py index.html
      - name: Test production Cloudflare gateway fail-closed behavior
        run: node --test tests/test_cloudflare_worker.mjs
      - name: Check Node.js API server and release-gate tests
        run: npm run check --prefix server
