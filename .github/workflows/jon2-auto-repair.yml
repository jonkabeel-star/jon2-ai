name: Jon2 Auto Repair

on:
  push:
    branches: [main]
    paths:
      - "**"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Jon2 AI Python Checks"
      - "Jon2 AI Code Checks"
      - "Jon2 AI Container Build"
      - "Jon2 Knowledge Retrieval Tests"
      - "Jon2 RTL compile and smoke tests"
      - "Jais 2 adapter contract checks"
      - "Jon2 Arabic 30M — gated training"
      - "Jon2 Saved Checkpoint Evaluation"
      - "Verify Jon2 Private Checkpoint"
      - "Jon2 Private Checkpoint Human Evaluation # UTF-8 sampling regression recheck"
      - "Jon2 Real CPU Training"
      - "Jon2 AI Kaggle Bridge"
    types: [completed]
    branches: [main]

concurrency:
  group: jon2-auto-repair-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diagnose-repair-verify:
    if: >-
      github.repository == 'jonkabeel-star/jon2-ai' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["Jon2 AI Python Checks","Jon2 AI Code Checks","Jon2 AI Container Build","Jon2 Knowledge Retrieval Tests","Jon2 RTL compile and smoke tests","Jais 2 adapter contract checks","Jon2 Arabic 30M — gated training","Jon2 Saved Checkpoint Evaluation","Verify Jon2 Private Checkpoint","Jon2 Private Checkpoint Human Evaluation # UTF-8 sampling regression recheck","Jon2 Real CPU Training","Jon2 AI Kaggle Bridge"]'), github.event.workflow_run.name)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy fastapi httpx
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Download logs from the failed trusted main-branch workflow
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p auto-repair-output
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > auto-repair-output/failed.log || true

      - name: Diagnose the failure, generate a bounded patch, and run the full Python gate
        run: |
          if [ -s auto-repair-output/failed.log ]; then
            python scripts/jon2_auto_repair.py --root . --logs auto-repair-output/failed.log --report auto-repair-output/report.json
          else
            python scripts/jon2_auto_repair.py --root . --report auto-repair-output/report.json
          fi

      - name: Upload diagnostic report even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jon2-auto-repair-report
          path: auto-repair-output/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit only verified safe repairs directly to main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(python - <<'PY'
          import json
          from pathlib import PurePosixPath
          report = json.load(open("auto-repair-output/report.json", encoding="utf-8"))
          allowed_roots = {"ai_engine", "tests"}
          protected = {"training_data", "checkpoints", "evaluation", "models", "secrets"}
          for name in report.get("changed_files", []):
              path = PurePosixPath(name)
              if (not path.parts or path.parts[0] not in allowed_roots
                  or path.suffix != ".py"
                  or any(part in protected for part in path.parts)
                  or path.is_absolute() or ".." in path.parts):
                  raise SystemExit("Refusing unsafe changed path: " + name)
              print(name)
          for proposal in report.get("repair_proposals", []):
              if proposal.get("status") == "patched":
                  path = PurePosixPath(proposal.get("file", ""))
                  if (not path.parts or path.parts[0] != "ai_engine"
                      or path.suffix != ".py"
                      or any(part in protected for part in path.parts)):
                      raise SystemExit("Refusing unsafe repair proposal path.")
          PY
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No allowlisted code changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${changed_files[@]}"
          if git diff --cached --quiet; then
            echo "No staged changes."
            exit 0
          fi
          git commit -m "Apply verified safe Jon2 auto-repair"
          git push origin HEAD:main
