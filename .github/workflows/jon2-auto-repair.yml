name: Jon2 Auto Repair

on:
  push:
    branches: [main]
    paths:
      - "ai_engine/**/*.py"
      - "tests/**/*.py"
      - "scripts/**/*.py"
      - ".github/workflows/jon2-auto-repair.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Jon2 AI Python Checks"
      - "Jon2 AI Code Checks"
      - "Jon2 AI Container Build"
    types: [completed]
    branches: [main]

concurrency:
  group: jon2-auto-repair-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose-repair-verify:
    if: >-
      github.repository == 'jonkabeel-star/jon2-ai' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["Jon2 AI Python Checks","Jon2 AI Code Checks","Jon2 AI Container Build"]'), github.event.workflow_run.name)))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy fastapi httpx
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Download logs from the failed trusted main-branch workflow
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p auto-repair-output
          gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > auto-repair-output/failed.log || true

      - name: Diagnose the failure, generate a bounded patch, and run the full Python gate
        run: |
          if [ -s auto-repair-output/failed.log ]; then
            python scripts/jon2_auto_repair.py --root . --logs auto-repair-output/failed.log --report auto-repair-output/report.json
          else
            python scripts/jon2_auto_repair.py --root . --report auto-repair-output/report.json
          fi

      - name: Upload diagnostic report even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jon2-auto-repair-report
          path: auto-repair-output/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Open a repair pull request only after every check passes
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/jon2-auto-repair
          add-paths: |
            ai_engine/
            tests/
            scripts/
          delete-branch: true
          commit-message: "Apply verified safe Jon2 maintenance repairs"
          title: "Jon2 Auto Repair: verified safe maintenance"
          body: |
            ## Automated repair report

            Jon2 Auto Repair analyzed trusted workflow failure logs when available,
            classified common Python/CI failure types and applied only an exact
            allowlisted missing-standard-library-import patch (or safe whitespace
            normalization), then reran the repository checks.

            - All configured checks passed before this pull request was opened.
            - Any code patch is limited to an exact missing standard-library import rule.
            - Model checkpoints, training data, secrets, and deployment settings are not modified.
            - Human review is required before merge.
          labels: |
            automated
            maintenance
