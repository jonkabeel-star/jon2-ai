name: Jon2 Auto Repair

on:
  push:
    branches: [main]
    paths:
      - "ai_engine/**/*.py"
      - "tests/**/*.py"
      - "scripts/jon2_auto_repair.py"
      - ".github/workflows/jon2-auto-repair.yml"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: jon2-auto-repair-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  diagnose-repair-verify:
    if: github.repository == 'jonkabeel-star/jon2-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy fastapi httpx
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Diagnose, apply safe repairs, and run the full Python gate
        run: python scripts/jon2_auto_repair.py --root . --report auto-repair-output/report.json

      - name: Upload diagnostic report even when a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jon2-auto-repair-report
          path: auto-repair-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Open a repair pull request only after every check passes
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/jon2-auto-repair
          add-paths: |
            ai_engine/
            tests/
          delete-branch: true
          commit-message: "Apply verified safe Jon2 maintenance repairs"
          title: "Jon2 Auto Repair: verified safe maintenance"
          body: |
            ## Automated repair report

            Jon2 Auto Repair applied whitespace-only Python source normalization
            and ran the repository's Python tests and data audits.

            - All configured checks passed before this pull request was opened.
            - Only whitespace and final-newline changes are permitted.
            - Model checkpoints, training data, secrets, and deployment settings are not modified.
            - Human review is required before merge.
          labels: |
            automated
            maintenance
