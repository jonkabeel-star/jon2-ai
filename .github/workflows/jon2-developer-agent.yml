name: Jon2 Developer Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

concurrency:
  group: jon2-developer-agent
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  propose:
    if: github.repository == 'jonkabeel-star/jon2-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install fixed test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy fastapi httpx
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Validate agent script syntax
        run: python -m py_compile scripts/jon2_developer_agent.py

      - name: Ask Jon2 Developer Agent for a bounded improvement
        id: agent
        env:
          JON2_CF_ACCOUNT_ID: ${{ secrets.JON2_CF_ACCOUNT_ID }}
          JON2_CF_API_TOKEN: ${{ secrets.JON2_CF_API_TOKEN }}
        run: python scripts/jon2_developer_agent.py

      - name: Run repository verification gates
        if: steps.agent.outputs.changed == 'true'
        run: |
          python scripts/jon2_auto_repair.py --root . --report auto-repair-output/report.json

      - name: Upload proposal and verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jon2-developer-agent-report
          path: |
            jon2-developer-agent-report.json
            auto-repair-output/report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Open review-only pull request
        if: success() && steps.agent.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: bot/jon2-developer-agent
          delete-branch: false
          add-paths: |
            ai_engine/**/*.py
          commit-message: "[skip ci] Propose reviewed Jon2 AI improvement"
          title: "Jon2 Developer Agent: proposed engineering improvement"
          body: |
            This pull request was generated by the bounded Jon2 Developer Agent using Cloudflare Workers AI.

            - Only existing Python source files under ai_engine/ may be proposed; tests are read-only context.
            - At most two files and 28,000 characters are allowed per run.
            - The repository verification workflow must pass before this PR is opened.
            - The agent cannot edit workflows, deployment configuration, CORS, authentication, secrets, model weights, datasets, or checkpoints.
            - This PR is not merged or deployed automatically. Human review is required.
            - Inspect the jon2-developer-agent-report artifact for the model's summary and changed paths.
