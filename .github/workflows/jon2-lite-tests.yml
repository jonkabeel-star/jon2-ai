name: Jon2 Lite Arabic Tests

on:
  push:
    branches: [feat/jon2-lite-core]
    paths:
      - "jon2_lite/**"
      - "tests/test_jon2_lite.py"
      - ".github/workflows/jon2-lite-tests.yml"
  pull_request:
    paths:
      - "jon2_lite/**"
      - "tests/test_jon2_lite.py"
      - ".github/workflows/jon2-lite-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arabic-and-memory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check fastapi httpx
      - name: Compile Jon2 Lite source
        run: python -m compileall -q jon2_lite
      - name: Run Arabic brain and SQLite memory tests
        run: python -m unittest tests.test_jon2_lite -v
