name: Jon2 AI Python Checks

on:
  push:
    branches: [main]
    paths:
      - "ai_engine/**"
      - "tests/**"
      - ".github/workflows/jon2-python-checks.yml"
  pull_request:
    paths:
      - "ai_engine/**"
      - "tests/**"
      - ".github/workflows/jon2-python-checks.yml"

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Compile Python modules
        run: python -m compileall -q ai_engine tests

      - name: Test training source approval gate
        run: python -m unittest discover -s tests -v

      - name: Test Jon2 AI engine runtime and tokenizer
        run: python -m unittest discover -s ai_engine -p 'test_*.py' -v

      - name: Test checkpoint loading and chat runtime
        run: python -m unittest discover -s ai_engine/tests -p 'test_*.py' -v

      - name: Audit current training text
        run: python ai_engine/audit_data.py
