name: Jon2 AI Python Checks

on:
  push:
    branches: [main]
    paths:
      - "ai_engine/**"
      - "tests/**"
      - ".github/workflows/jon2-python-checks.yml"
  pull_request:
    paths:
      - "ai_engine/**"
      - "tests/**"
      - ".github/workflows/jon2-python-checks.yml"

permissions:
  contents: read

jobs:
  python-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install fastapi httpx

      - name: Compile Python modules
        run: python -m compileall -q ai_engine tests

      - name: Test training source approval gate
        run: python -m unittest discover -s tests -v

      - name: Test Jon2 Auto Repair safety rules
        run: python -m unittest tests.test_auto_repair_safety -v

      - name: Test Jon2 AI engine runtime and tokenizer
        run: python -m unittest discover -s ai_engine -p 'test_*.py' -v

      - name: Test checkpoint loading, chat runtime, and Arabic coverage
        run: python -m unittest discover -s ai_engine/tests -t . -p 'test_*.py' -v

      - name: Audit current training text
        run: python ai_engine/audit_data.py

      - name: Audit Arabic character and vocabulary coverage
        run: python ai_engine/audit_language.py --data ai_engine/training_data

      - name: Audit tokenizer efficiency and byte fallback
        run: python ai_engine/audit_tokenizer.py --data ai_engine/training_data

      - name: Audit corpus quality and privacy signals
        run: python ai_engine/audit_corpus_quality.py --data ai_engine/training_data

      - name: Build privacy-conscious dataset inventory
        run: python ai_engine/dataset_inventory.py --data ai_engine/training_data

      - name: Preflight arabic_30m readiness without training
        id: arabic-30m-preflight
        run: |
          set +e
          mkdir -p training-output
          python ai_engine/preflight_training.py \
            --profile arabic_30m \
            --data ai_engine/training_data \
            --approval-manifest ai_engine/training_data/source_approvals.json \
            --output training-output/arabic-30m-preflight.json
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "RESULT=BLOCKED" >> "$GITHUB_OUTPUT"
            echo "30M training is correctly blocked by the readiness safeguards."
          elif [ "$status" -eq 0 ]; then
            echo "RESULT=READY" >> "$GITHUB_OUTPUT"
            echo "Preflight passed. This is not authorization to start training."
          else
            echo "::error::Preflight crashed or encountered an unexpected error (exit $status)."
            exit "$status"
          fi
          cat training-output/arabic-30m-preflight.json

      - name: Upload 30M preflight report
        if: always() && hashFiles('training-output/arabic-30m-preflight.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jon2-arabic-30m-preflight
          path: training-output/arabic-30m-preflight.json
          if-no-files-found: error
          retention-days: 14
