<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b14">
<title>Jon2 AI Assistant</title>
<style>
:root{color-scheme:dark;--bg:#080b14;--panel:#111827;--line:#29344b;--blue:#6385ff;--cyan:#52e2db;--text:#f4f7ff;--muted:#a8b3ca}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
button,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1000px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0 22px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}
.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--cyan));color:#07101c;font-weight:900;font-size:20px}
h1{font-size:21px;margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
.lang,.secondary,.connect{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:11px;padding:10px 13px}
.hero{padding:30px 0 20px}
.hero h2{font-size:clamp(28px,5vw,42px);margin:8px 0}
.hero p{color:var(--muted);line-height:1.8}
.status{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:30px;color:var(--cyan);font-size:12px}
.chat{border:1px solid var(--line);border-radius:18px;background:#0d1320;overflow:hidden}
.chat-head{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.chat-head strong{font-size:15px}
.messages{height: min(52vh,480px);min-height:260px;overflow-y:auto;padding:16px}
.msg{max-width:90%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.8;padding:12px 14px;margin:10px 0;border-radius:14px}
.bot{background:#182236;margin-inline-end:auto}
.user{background:#263966;margin-inline-start:auto}
.composer{padding:13px;border-top:1px solid var(--line);display:flex;gap:10px}
textarea{resize:vertical;min-height:52px;max-height:160px;flex:1;min-width:0;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;outline:none}
textarea:focus{border-color:var(--blue)}
.send{border:0;border-radius:12px;padding:0 20px;background:linear-gradient(135deg,var(--blue),#7b67ff);color:white;font-weight:700}
.note{font-size:12px;color:var(--muted);line-height:1.8;margin:15px 2px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:25px 0}
button:disabled{opacity:.55;cursor:wait}
@media(max-width:560px){.app{padding:13px}.hero{padding-top:24px}.composer{flex-direction:column}.send{min-height:48px}.messages{height:48vh}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">J2</div>
    <div><h1>Jon2 AI</h1><div class="sub" data-t="tagline">مساعدك الذكي المستقل</div></div>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="connect" id="connect" data-t="connect">ربط الخادم</button><button class="lang" id="language">English 🌐</button></div>
</header>
<section class="hero">
  <span class="status" id="status" data-t="status">واجهة Jon2 AI</span>
  <h2 data-t="headline">أهلًا بك في Jon2 AI</h2>
  <p data-t="intro">اكتب سؤالك أو فكرتك في المحادثة بالأسفل.</p>
</section>
<section class="chat">
  <div class="chat-head">
    <strong data-t="assistant">🤖 المساعد الذكي</strong>
    <button class="secondary" id="clear" data-t="clear">مسح المحادثة</button>
  </div>
  <div class="messages" id="messages" aria-live="polite">
    <div class="msg bot" data-t="welcome">مرحبًا! أنا واجهة Jon2 AI. بعد ربط نموذج الذكاء الاصطناعي، ستظهر ردوده هنا.</div>
  </div>
  <form class="composer" id="form">
    <textarea id="input" data-ph="placeholder" placeholder="اكتب رسالتك هنا..." required></textarea>
    <button class="send" id="send" type="submit" data-t="send">إرسال ↑</button>
  </form>
</section>
<p class="note" id="note" data-t="note">هذه الواجهة تحتاج إلى ربط بخادم نموذج ذكاء اصطناعي لتقديم ردود حقيقية.</p>
<footer>Jon2 AI ©</footer>
</div>
<script>
const text={
ar:{
tagline:"مساعدك الذكي المستقل",status:"واجهة Jon2 AI",headline:"أهلًا بك في Jon2 AI",
intro:"اكتب سؤالك أو فكرتك في المحادثة بالأسفل.",assistant:"🤖 المساعد الذكي",
clear:"مسح المحادثة",connect:"ربط الخادم",welcome:"مرحبًا! أنا واجهة Jon2 AI. بعد ربط نموذج الذكاء الاصطناعي، ستظهر ردوده هنا.",
placeholder:"اكتب رسالتك هنا...",send:"إرسال ↑",
note:"هذه الواجهة تحتاج إلى ربط بخادم نموذج ذكاء اصطناعي لتقديم ردود حقيقية.",
error:"تعذر الاتصال بالخادم. اضغط «ربط الخادم» وأدخل رابط Render الصحيح.",
empty:"اكتب رسالة أولًا."
},
en:{
tagline:"Your independent AI assistant",status:"Jon2 AI interface",headline:"Welcome to Jon2 AI",
intro:"Type your question or idea in the chat below.",assistant:"🤖 AI Assistant",
clear:"Clear chat",connect:"Connect server",welcome:"Welcome! This is the Jon2 AI interface. AI responses will appear here after a model is connected.",
placeholder:"Type your message here...",send:"Send ↑",
note:"This interface needs to connect to an AI model server to provide real responses.",
error:"Could not reach the server. Tap “Connect server” and enter your Render URL.",
empty:"Please type a message first."
}};
let lang=localStorage.getItem("jon2_language")||"ar";
let apiBase=(localStorage.getItem("jon2_api_url")||"").replace(/\/$/,"");

function setLang(l){
  lang=l;
  localStorage.setItem("jon2_language",l);
  document.documentElement.lang=l;
  document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=text[l][e.dataset.t]);
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=text[l][e.dataset.ph]);
  document.getElementById("language").textContent=l==="ar"?"English 🌐":"العربية 🌐";
}
document.getElementById("language").addEventListener("click",()=>setLang(lang==="ar"?"en":"ar"));

document.getElementById("connect").addEventListener("click",()=>{
  const entered=prompt(
    lang==="ar"?"الصق رابط خادم Render، مثال: https://your-service.onrender.com":"Paste your Render server URL, e.g. https://your-service.onrender.com",
    apiBase
  );
  if(entered===null)return;
  try{
    const u=new URL(entered.trim());
    if(u.protocol!=="https:")throw new Error("HTTPS required");
    apiBase=u.origin;
    localStorage.setItem("jon2_api_url",apiBase);
    checkServer();
  }catch{
    alert(lang==="ar"?"الرابط غير صحيح. استخدم رابط HTTPS الخاص بخدمة Render.":"Invalid URL. Use your Render service HTTPS URL.");
  }
});

async function checkServer(){
  const status=document.getElementById("status");
  if(!apiBase){
    status.textContent=lang==="ar"?"الخادم غير مربوط":"Server not connected";
    return;
  }
  try{
    const r=await fetch(apiBase+"/api/health");
    if(!r.ok)throw new Error("Health check failed");
    const d=await r.json();
    status.textContent=d.model_loaded
      ?(lang==="ar"?"النموذج جاهز":"Model ready")
      :(lang==="ar"?"الخادم متصل — النموذج لم يُحمّل":"Server online — model not loaded");
  }catch{
    status.textContent=lang==="ar"?"تعذر الوصول للخادم":"Server unreachable";
  }
}
function addMessage(value,kind){
const el=document.createElement("div");el.className="msg "+kind;el.textContent=value;
document.getElementById("messages").appendChild(el);
document.getElementById("messages").scrollTop=document.getElementById("messages").scrollHeight;
}
document.getElementById("clear").addEventListener("click",()=>{
document.getElementById("messages").replaceChildren();
addMessage(text[lang].welcome,"bot");
});
document.getElementById("form").addEventListener("submit",async e=>{
  e.preventDefault();
  const input=document.getElementById("input");
  const message=input.value.trim();
  if(!message)return;
  addMessage(message,"user");
  input.value="";
  const send=document.getElementById("send");
  send.disabled=true;
  try{
    if(!apiBase)throw new Error("No server URL");
    const r=await fetch(apiBase+"/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({message})
    });
    const data=await r.json();
    if(!r.ok)throw new Error(data.detail||data.error||"Server request failed");
    const reply=data.reply||data.response||data.message;
    if(typeof reply!=="string"||!reply.trim())throw new Error("No reply");
    addMessage(reply,"bot");
  }catch(err){
    addMessage(err.message==="No server URL"?text[lang].error:err.message,"bot");
  }finally{
    send.disabled=false;
    input.focus();
  }
});
setLang(lang);
checkServer();
</script>
</body>
</html>
